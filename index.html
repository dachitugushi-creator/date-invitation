<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 350px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .sticker {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      background: #ff5c8a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
    }

    /* Кнопки в один ряд */
    .btn-container {
      display: flex !important;
      flex-direction: row !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 15px !important;
      margin-top: 20px;
      position: relative;
      min-height: 60px;
    }

    .btn-yes {
      position: relative !important;
      z-index: 2;
      margin: 0 !important;
    }

    #btn-no {
      background: linear-gradient(135deg, #a8a8a8 0%, #d1d1d1 100%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      position: relative !important;
      z-index: 10;
      transition: all 0.15s ease;
      margin: 0 !important;
    }

    .datetime-picker {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 20px 0;
    }

    .datetime-picker input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Шаг 1: Приветствие -->
    <div class="step active" id="step-1">
      <img class="sticker" src="https://media.tenor.com/images/737e408d6c7ee339a9c513be88ef779d/tenor.gif" alt="Cute Dog">
      <h1>Привет, бусинка! 💖</h1>
      <p>У меня к тебе есть один очень важный вопрос...</p>
      <button onclick="nextStep(2)">Открыть ✨</button>
    </div>

    <!-- Шаг 2: Главный вопрос -->
    <div class="step" id="step-2">
      <img class="sticker" src="https://media.tenor.com/images/737e408d6c7ee339a9c513be88ef779d/tenor.gif" alt="Cute Dog">
      <h2>Пойдешь со мной на свидание? 💕💕</h2>
      <div class="btn-container" id="no-container">
        <button class="btn-yes" onclick="nextStep(3)">Да! 💖</button>
        <button id="btn-no" onmouseover="moveButton()" onclick="moveButton()">Нет 😭</button>
      </div>
    </div>

    <!-- Шаг 3: Выбор даты и времени -->
    <div class="step" id="step-3">
      <h2>Отлично! 🎉</h2>
      <p>Выбери, когда ты свободна:</p>
      <div class="datetime-picker">
        <input type="date" id="date-picker">
        <input type="time" id="time-picker" value="18:00">
      </div>
      <button onclick="nextStep(4)">Дальше ➔</button>
    </div>

    <!-- Шаг 4: Финал -->
    <div class="step" id="step-4">
      <h2>Ура! До встречи! 🥰</h2>
      <p>Я буду очень тебя ждать!</p>
    </div>
  </div>

  <script>
    function nextStep(stepNumber) {
      document.querySelectorAll('.step').forEach(step => {
        step.classList.remove('active');
      });
      document.getElementById('step-' + stepNumber).classList.add('active');
    }

    function moveButton() {
      const btn = document.getElementById('btn-no');
      const container = document.getElementById('no-container');
      
      const containerRect = container.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      
      const maxX = containerRect.width - btnRect.width;
      const maxY = 150; 

      const randomX = (Math.random() - 0.5) * 200;
      const randomY = (Math.random() - 0.5) * 100;

      btn.style.position = 'absolute';
      btn.style.left = randomX + 'px';
      btn.style.top = randomY + 'px';
    }
  </script>
</body>
</html>
